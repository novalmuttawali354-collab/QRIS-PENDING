name: Build CITAWIN APK
on:
  push:
    branches: [ "citawin-apk-v1" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk CITAWIN_AUTO_REKAP_ANDROID.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CITAWIN-AUTO-REKAP-APK
          path: CITAWIN_AUTO_REKAP_ANDROID.apk
          if-no-files-found: error
