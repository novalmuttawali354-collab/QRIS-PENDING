name: Build CITAWIN Android APK
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-citawin-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APK source branch
        uses: actions/checkout@v4
        with:
          ref: citawin-apk-v1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CITAWIN_AUTO_REKAP_ANDROID.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CITAWIN-AUTO-REKAP-APK
          path: CITAWIN_AUTO_REKAP_ANDROID.apk
          if-no-files-found: error
